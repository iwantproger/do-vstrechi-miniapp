<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>До встречи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      overflow-x: hidden;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px 16px;
      border-radius: 0 0 20px 20px;
      color: white;
      margin: -16px -16px 24px -16px;
    }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.9; }

    /* Back button — Issue 5 */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--tg-theme-button-color, #0088cc);
      font-size: 14px;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 12px;
    }
    .back-btn:active { opacity: 0.6; }

    .meeting-card {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .meeting-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .meeting-meta { display: flex; gap: 16px; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tg-theme-hint-color, #999); }
    .meeting-description { font-size: 13px; line-height: 1.5; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); }

    .section-title { font-size: 17px; font-weight: 600; margin: 24px 0 14px; }

    /* Calendar */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-month { font-size: 17px; font-weight: 600; }
    .calendar-nav { display: flex; gap: 10px; }
    .calendar-nav button {
      width: 34px; height: 34px; border: none;
      background: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #fff);
      border-radius: 50%; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .calendar-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
    .calendar-day-header { text-align: center; font-weight: 600; padding: 6px 2px; font-size: 11px; color: var(--tg-theme-hint-color, #999); }
    .calendar-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; cursor: pointer; transition: all 0.15s;
      font-size: 14px; font-weight: 500;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    }
    .calendar-day.disabled { color: var(--tg-theme-hint-color, #ccc); cursor: not-allowed; background: transparent; }
    .calendar-day.available:hover { background: var(--tg-theme-button-color, #0088cc); color: white; transform: scale(1.05); }
    .calendar-day.selected { background: var(--tg-theme-button-color, #0088cc); color: white; box-shadow: 0 4px 12px rgba(0,136,204,0.35); }
    .calendar-day.today { border: 2px solid var(--tg-theme-button-color, #0088cc); }

    /* Time slots */
    .time-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .time-slot {
      padding: 13px 6px; border: 2px solid var(--tg-theme-hint-color, #ddd);
      border-radius: 10px; text-align: center; cursor: pointer;
      transition: all 0.15s; font-weight: 500; font-size: 14px;
      background: var(--tg-theme-bg-color, #fff);
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .time-slot:active { transform: scale(0.95); }
    .time-slot:hover { border-color: var(--tg-theme-button-color, #0088cc); }
    .time-slot.selected {
      background: var(--tg-theme-button-color, #0088cc);
      color: white; border-color: var(--tg-theme-button-color, #0088cc);
      box-shadow: 0 4px 12px rgba(0,136,204,0.35);
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 13px; }
    .form-label .required { color: #ff3b30; }
    .form-input {
      width: 100%; padding: 13px 15px;
      border: 2px solid var(--tg-theme-hint-color, #ddd);
      border-radius: 10px; font-size: 15px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--tg-theme-button-color, #0088cc); }
    textarea.form-input { resize: vertical; min-height: 90px; font-family: inherit; }

    /* Submit button */
    .submit-btn {
      width: 100%; padding: 17px;
      background: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, white);
      border: none; border-radius: 12px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      margin-top: 18px;
      box-shadow: 0 4px 14px rgba(0,136,204,0.3);
      transition: opacity 0.2s;
    }
    .submit-btn:active { opacity: 0.8; transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* States */
    .loading { text-align: center; padding: 50px 20px; color: var(--tg-theme-hint-color, #999); }
    .loading-spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(0,136,204,0.2);
      border-top-color: var(--tg-theme-button-color, #0088cc);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: #ffebee; color: #c62828;
      padding: 14px; border-radius: 10px; margin-bottom: 14px;
      border-left: 4px solid #c62828; font-size: 14px;
    }
    .error h3 { margin-bottom: 6px; }

    .success {
      background: #e8f5e9; color: #2e7d32;
      padding: 18px; border-radius: 12px; margin-bottom: 14px;
      border-left: 4px solid #2e7d32;
    }
    .success h2 { margin-bottom: 10px; font-size: 19px; }

    .empty-state { text-align: center; padding: 36px 20px; color: var(--tg-theme-hint-color, #999); }
    .empty-state-icon { font-size: 44px; margin-bottom: 14px; }

    .hidden { display: none; }

    .summary-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 18px; border-radius: 14px; margin-bottom: 20px;
    }
    .summary-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
    .summary-item:last-child { margin-bottom: 0; }
    .summary-icon { font-size: 18px; }
    .meeting-link { background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; margin-top: 10px; word-break: break-all; }
    .meeting-link a { color: white; text-decoration: underline; }

    /* Cabinet styles — Issue 4 */
    .cabinet-section { margin-bottom: 28px; }
    .cabinet-schedule-card {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .cabinet-schedule-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .cabinet-schedule-meta { font-size: 13px; color: var(--tg-theme-hint-color, #888); margin-bottom: 12px; }
    .cabinet-btn-row { display: flex; gap: 8px; }
    .cabinet-btn {
      flex: 1; padding: 10px 8px;
      border-radius: 9px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; text-align: center;
      transition: opacity 0.15s;
    }
    .cabinet-btn:active { opacity: 0.7; }
    .cabinet-btn-primary {
      background: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, white);
    }
    .cabinet-btn-secondary {
      background: transparent;
      color: var(--tg-theme-button-color, #0088cc);
      border: 2px solid var(--tg-theme-button-color, #0088cc) !important;
    }

    @media (max-width: 380px) {
      .calendar { gap: 3px; }
      .time-slots { grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 7px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📅 До встречи</h1>
    <p id="header-subtitle">Запись на встречу</p>
  </div>

  <div id="app">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Загрузка...</p>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  BACKEND_API_URL: 'https://do-vstrechi-backend-production.up.railway.app'
};

// ============================================================
// TELEGRAM INIT
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

// ============================================================
// STATE
// ============================================================
const state = {
  mode: null,            // 'booking' | 'cabinet'
  meetingType: null,
  currentMonth: new Date(),
  selectedDate: null,
  selectedTime: null,
  availableSlots: [],
  error: null,
  // back-stack for Issue 5
  step: 'calendar'       // 'calendar' | 'slots' | 'form'
};

// ============================================================
// API
// ============================================================
async function apiFetch(path, options = {}) {
  const response = await fetch(`${CONFIG.BACKEND_API_URL}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.detail || `HTTP ${response.status}`);
  }
  return response.json();
}

async function loadMeetingType(scheduleId) {
  const data = await apiFetch(`/api/schedules/${scheduleId}`);
  return {
    id: data.id,
    title: data.title,
    description: data.description || '',
    duration: data.duration,
    buffer_time: data.buffer_time,
    work_days: data.work_days,
    work_hours_start: data.work_hours_start || '09:00',
    work_hours_end: data.work_hours_end || '18:00',
  };
}

async function loadAvailableSlots(scheduleId, date) {
  const dateStr = formatDateLocal(date);
  const data = await apiFetch(`/api/available-slots/${scheduleId}?date=${dateStr}`);

  let slots = data.available_slots || [];

  // Issue 3: Filter past slots for today using USER'S local time
  const today = new Date();
  const todayStr = formatDateLocal(today);
  if (dateStr === todayStr) {
    const nowH = today.getHours();
    const nowM = today.getMinutes();
    slots = slots.filter(slot => {
      const [h, m] = slot.time.split(':').map(Number);
      // Add 5 min buffer so slot at "current minute" isn't shown
      return h > nowH || (h === nowH && m > nowM + 5);
    });
  }

  return slots;
}

async function createBooking(bookingData) {
  return apiFetch('/api/bookings', {
    method: 'POST',
    body: JSON.stringify(bookingData)
  });
}

// ============================================================
// DATE HELPERS
// ============================================================

/** Format date as YYYY-MM-DD in LOCAL timezone (Issue 3) */
function formatDateLocal(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// ============================================================
// RENDER — BOOKING MODE
// ============================================================

function renderApp() {
  const app = document.getElementById('app');

  app.innerHTML = `
    ${state.error ? `<div class="error">${state.error}</div>` : ''}

    <div class="meeting-card">
      <div class="meeting-title">${escHtml(state.meetingType.title)}</div>
      <div class="meeting-meta">
        <div class="meta-item"><span>⏱</span><span>${state.meetingType.duration} мин</span></div>
      </div>
      ${state.meetingType.description
        ? `<div class="meeting-description">${escHtml(state.meetingType.description)}</div>`
        : ''}
    </div>

    <!-- STEP: Calendar -->
    <div id="step-calendar">
      <div class="section-title">Выберите дату</div>
      <div id="calendar-container"></div>
    </div>

    <!-- STEP: Time slots (Issue 5: back button) -->
    <div id="step-slots" class="hidden">
      <button class="back-btn" onclick="goBack('calendar')">← Изменить дату</button>
      <div class="section-title">Выберите время</div>
      <div id="time-slots"></div>
    </div>

    <!-- STEP: Form (Issue 5: back button) -->
    <div id="step-form" class="hidden">
      <button class="back-btn" onclick="goBack('slots')">← Изменить время</button>
      <div id="summary-container"></div>
      <div class="section-title">Ваши данные</div>
      <div class="form-group">
        <label class="form-label">Ваше имя <span class="required">*</span></label>
        <input type="text" class="form-input" id="guest-name" placeholder="Иван Иванов">
      </div>
      <div class="form-group">
        <label class="form-label">Email или Telegram <span class="required">*</span></label>
        <input type="text" class="form-input" id="guest-contact" placeholder="@username или email@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Дополнительно</label>
        <textarea class="form-input" id="guest-notes" placeholder="Что хотите обсудить?"></textarea>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitBooking()">
        ✅ Подтвердить бронирование
      </button>
    </div>

    <div id="step-success" class="hidden"></div>
  `;

  renderCalendar();
  showStep('calendar');
}

// Issue 5: back navigation
window.goBack = function(to) {
  if (to === 'calendar') {
    state.selectedTime = null;
    showStep('calendar');
  } else if (to === 'slots') {
    state.selectedTime = null;
    showStep('slots');
  }
};

function showStep(step) {
  state.step = step;
  ['calendar', 'slots', 'form', 'success'].forEach(s => {
    const el = document.getElementById(`step-${s}`);
    if (el) el.classList.toggle('hidden', s !== step);
  });
}

function renderCalendar() {
  const container = document.getElementById('calendar-container');
  if (!container) return;

  const year = state.currentMonth.getFullYear();
  const month = state.currentMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                      'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  const isCurrentMonth = (month === today.getMonth() && year === today.getFullYear());

  let html = `
    <div class="calendar-header">
      <div class="calendar-month">${monthNames[month]} ${year}</div>
      <div class="calendar-nav">
        <button onclick="changeMonth(-1)" ${isCurrentMonth ? 'disabled' : ''}>←</button>
        <button onclick="changeMonth(1)">→</button>
      </div>
    </div>
    <div class="calendar">
  `;

  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
    html += `<div class="calendar-day-header">${d}</div>`;
  });

  const startDOW = firstDay.getDay(); // 0=Sun
  const offset = startDOW === 0 ? 6 : startDOW - 1;
  for (let i = 0; i < offset; i++) html += '<div></div>';

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const isPast = date < today;
    const isToday = date.getTime() === today.getTime();
    const dateStr = formatDateLocal(date);
    const isSelected = state.selectedDate === dateStr;
    const dow = date.getDay() === 0 ? 6 : date.getDay() - 1;
    const isWorkDay = state.meetingType.work_days.includes(dow);
    const isAvail = !isPast && isWorkDay;

    let cls = 'calendar-day';
    if (!isAvail) cls += ' disabled';
    else cls += ' available';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';

    html += `
      <div class="${cls}" ${isAvail ? `onclick="selectDate('${dateStr}')"` : ''}>
        ${day}
      </div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

window.changeMonth = function(dir) {
  state.currentMonth = new Date(
    state.currentMonth.getFullYear(),
    state.currentMonth.getMonth() + dir,
    1
  );
  renderCalendar();
};

window.selectDate = async function(dateStr) {
  state.selectedDate = dateStr;
  state.selectedTime = null;
  state.availableSlots = [];

  renderCalendar();
  showStep('slots');

  const slotsEl = document.getElementById('time-slots');
  slotsEl.innerHTML = `<div class="loading"><div class="loading-spinner"></div><p>Загрузка...</p></div>`;

  try {
    const date = new Date(dateStr + 'T12:00:00'); // avoid timezone shift
    state.availableSlots = await loadAvailableSlots(state.meetingType.id, date);
    renderTimeSlots();
  } catch (e) {
    slotsEl.innerHTML = `<div class="error"><p>Не удалось загрузить слоты: ${e.message}</p></div>`;
  }
};

function renderTimeSlots() {
  const slotsEl = document.getElementById('time-slots');
  if (!slotsEl) return;

  if (state.availableSlots.length === 0) {
    slotsEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">😔</div>
        <p>На эту дату нет свободных слотов</p>
        <p style="font-size:13px;margin-top:6px;color:#999;">Выберите другой день</p>
      </div>`;
    return;
  }

  slotsEl.innerHTML = state.availableSlots.map(slot => {
    const sel = state.selectedTime === slot.time;
    return `<div class="time-slot ${sel ? 'selected' : ''}" onclick="selectTime('${slot.time}')">${slot.time}</div>`;
  }).join('');
}

// Issue 1: Fixed — use offClick before onClick to prevent listener accumulation
window.selectTime = function(time) {
  state.selectedTime = time;

  // Update slot visuals WITHOUT rebuilding all steps
  renderTimeSlots();

  // Show form step
  showStep('form');

  // Autofill from Telegram
  const nameInput = document.getElementById('guest-name');
  const contactInput = document.getElementById('guest-contact');
  if (nameInput && !nameInput.value) {
    const u = tg?.initDataUnsafe?.user;
    if (u) {
      if (u.first_name) nameInput.value = u.first_name + (u.last_name ? ' ' + u.last_name : '');
      if (u.username) contactInput.value = '@' + u.username;
    }
  }

  // Render summary
  renderSummary();

  // Issue 1: Fix MainButton listener accumulation
  if (tg?.MainButton) {
    tg.MainButton.offClick(submitBooking);   // remove previous listener first
    tg.MainButton.setText('Подтвердить бронирование');
    tg.MainButton.show();
    tg.MainButton.onClick(submitBooking);
    // Hide HTML button when Telegram MainButton is available
    const btn = document.getElementById('submit-btn');
    if (btn) btn.style.display = 'none';
  }

  // Scroll to form top
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function renderSummary() {
  const container = document.getElementById('summary-container');
  if (!container || !state.selectedDate || !state.selectedTime) return;

  // Parse date in local timezone
  const [y, m, d] = state.selectedDate.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const dateStr = date.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

  container.innerHTML = `
    <div class="summary-card">
      <div class="summary-item"><span class="summary-icon">📅</span><span>${dateStr}</span></div>
      <div class="summary-item"><span class="summary-icon">⏰</span><span>${state.selectedTime}</span></div>
      <div class="summary-item"><span class="summary-icon">⏱</span><span>${state.meetingType.duration} мин</span></div>
    </div>`;
}

// ============================================================
// SUBMIT BOOKING
// ============================================================

window.submitBooking = async function() {
  const name = document.getElementById('guest-name')?.value.trim();
  const contact = document.getElementById('guest-contact')?.value.trim();
  const notes = document.getElementById('guest-notes')?.value.trim();

  if (!name || !contact) {
    alert('Пожалуйста, заполните имя и контакт');
    return;
  }
  if (!state.selectedDate || !state.selectedTime) {
    alert('Выберите дату и время');
    return;
  }

  // Disable button
  const btn = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Отправляем...'; }
  if (tg?.MainButton) tg.MainButton.showProgress();

  const bookingData = {
    schedule_id: state.meetingType.id,
    guest_name: name,
    guest_contact: contact,
    guest_telegram_id: tg?.initDataUnsafe?.user?.id || null,
    scheduled_time: `${state.selectedDate}T${state.selectedTime}:00`,
    notes: notes || null
  };

  try {
    const result = await createBooking(bookingData);
    if (tg?.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.hide(); }
    showSuccess(result);
  } catch (e) {
    if (tg?.MainButton) tg.MainButton.hideProgress();
    if (btn) { btn.disabled = false; btn.textContent = '✅ Подтвердить бронирование'; }
    const errDiv = document.getElementById('booking-error');
    if (errDiv) {
      errDiv.textContent = `❌ ${e.message}`;
      errDiv.style.display = 'block';
    }
  }
};

function showSuccess(booking) {
  showStep('success');
  const el = document.getElementById('step-success');
  if (!el) return;

  // Parse time from booking
  let dateLabel = '';
  let timeLabel = '';
  try {
    const dt = new Date(booking.scheduled_time);
    dateLabel = dt.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    timeLabel = dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch(e) {
    dateLabel = state.selectedDate;
    timeLabel = state.selectedTime;
  }

  el.innerHTML = `
    <div class="success">
      <h2>✅ Встреча забронирована!</h2>
      <p>Вы получите подтверждение в Telegram.</p>
    </div>
    <div class="summary-card">
      <div class="summary-item"><span class="summary-icon">📅</span><span>${dateLabel}</span></div>
      <div class="summary-item"><span class="summary-icon">⏰</span><span>${timeLabel}</span></div>
      <div class="summary-item"><span class="summary-icon">👤</span><span>${escHtml(booking.guest_name)}</span></div>
      ${booking.meeting_link ? `
        <div class="meeting-link">
          <div style="margin-bottom:6px;">🎥 <strong>Ссылка на встречу:</strong></div>
          <a href="${booking.meeting_link}" target="_blank">${booking.meeting_link}</a>
        </div>` : ''}
    </div>
    <button class="submit-btn" onclick="if(tg){tg.close();}">Закрыть</button>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// CABINET MODE — Issue 4
// ============================================================

async function initCabinet() {
  document.getElementById('header-subtitle').textContent = 'Личный кабинет';

  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading"><div class="loading-spinner"></div><p>Загрузка...</p></div>`;

  const tgUser = tg?.initDataUnsafe?.user;

  if (!tgUser || !tgUser.id) {
    app.innerHTML = `
      <div class="error">
        <h3>⚠️ Ошибка доступа</h3>
        <p>Откройте приложение через Telegram-бот.</p>
      </div>`;
    return;
  }

  try {
    const data = await apiFetch(`/api/schedules?telegram_id=${tgUser.id}`);
    renderCabinet(data.schedules || [], tgUser);
  } catch (e) {
    app.innerHTML = `
      <div class="error">
        <h3>⚠️ Ошибка загрузки</h3>
        <p>${e.message}</p>
        <button class="submit-btn" style="margin-top:12px;" onclick="initCabinet()">🔄 Повторить</button>
      </div>`;
  }
}

function renderCabinet(schedules, tgUser) {
  const app = document.getElementById('app');
  const name = tgUser.first_name || 'Пользователь';

  if (schedules.length === 0) {
    app.innerHTML = `
      <div style="margin-bottom:20px;">
        <div style="font-size:19px;font-weight:700;">👋 Привет, ${escHtml(name)}!</div>
        <div style="font-size:14px;color:var(--tg-theme-hint-color,#999);margin-top:4px;">Личный кабинет</div>
      </div>
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <p style="font-weight:600;margin-bottom:8px;">Расписаний пока нет</p>
        <p style="font-size:13px;">Создайте расписание через бота<br>и ссылка появится здесь</p>
      </div>`;
    return;
  }

  let html = `
    <div style="margin-bottom:20px;">
      <div style="font-size:19px;font-weight:700;">👋 Привет, ${escHtml(name)}!</div>
      <div style="font-size:14px;color:var(--tg-theme-hint-color,#999);margin-top:4px;">Ваши расписания</div>
    </div>`;

  schedules.forEach(s => {
    const bookingUrl = `${window.location.origin}${window.location.pathname}?schedule_id=${s.id}`;
    html += `
      <div class="cabinet-schedule-card">
        <div class="cabinet-schedule-title">📋 ${escHtml(s.title)}</div>
        <div class="cabinet-schedule-meta">
          ⏱ ${s.duration} мин &nbsp;·&nbsp; 🎥 ${escHtml(s.video_platform || '')}
        </div>
        <div id="link-display-${s.id}" style="font-size:12px;color:var(--tg-theme-hint-color,#999);margin-bottom:10px;word-break:break-all;">
          🔗 ${bookingUrl}
        </div>
        <div class="cabinet-btn-row">
          <button class="cabinet-btn cabinet-btn-primary" onclick="copyLink('${escHtml(bookingUrl)}', '${s.id}')">
            📋 Скопировать ссылку
          </button>
          <button class="cabinet-btn cabinet-btn-secondary" onclick="openSchedule('${s.id}')">
            👁 Открыть
          </button>
        </div>
        <div id="copy-ok-${s.id}" style="display:none;color:green;font-size:13px;margin-top:8px;text-align:center;">
          ✅ Скопировано!
        </div>
      </div>`;
  });

  app.innerHTML = html;
}

window.copyLink = function(url, scheduleId) {
  navigator.clipboard.writeText(url)
    .then(() => {
      const ok = document.getElementById(`copy-ok-${scheduleId}`);
      if (ok) {
        ok.style.display = 'block';
        setTimeout(() => { ok.style.display = 'none'; }, 2500);
      }
    })
    .catch(() => {
      // Fallback for older iOS
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const ok = document.getElementById(`copy-ok-${scheduleId}`);
      if (ok) { ok.style.display = 'block'; setTimeout(() => { ok.style.display = 'none'; }, 2500); }
    });
};

window.openSchedule = function(scheduleId) {
  const url = `${window.location.origin}${window.location.pathname}?schedule_id=${scheduleId}`;
  // Reload page with schedule_id — opens booking flow
  window.location.href = url;
};

// ============================================================
// UTILS
// ============================================================

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ============================================================
// INIT — routes to cabinet or booking mode
// ============================================================

async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  const scheduleId = urlParams.get('schedule_id');

  if (tg) {
    tg.enableClosingConfirmation();
    if (tg.themeParams?.bg_color) {
      document.body.style.backgroundColor = tg.themeParams.bg_color;
    }

    // Issue 5: Telegram BackButton
    tg.BackButton.onClick(() => {
      if (state.mode === 'cabinet') {
        tg.close();
        return;
      }
      if (state.step === 'slots') { goBack('calendar'); tg.BackButton.hide(); }
      else if (state.step === 'form') { goBack('slots'); }
      else { tg.BackButton.hide(); }
    });
  }

  if (!scheduleId) {
    // Issue 4: Cabinet mode
    state.mode = 'cabinet';
    await initCabinet();
    return;
  }

  // Booking mode
  state.mode = 'booking';

  try {
    state.meetingType = await loadMeetingType(scheduleId);
    renderApp();

    if (tg?.BackButton) {
      // Show back button when moving away from calendar
      // (handled in showStep logic)
    }
  } catch (e) {
    console.error('Init error:', e);
    document.getElementById('app').innerHTML = `
      <div class="error">
        <h3>⚠️ Ошибка загрузки</h3>
        <p>${e.message}</p>
        <button class="submit-btn" style="margin-top:12px;" onclick="init()">🔄 Повторить</button>
      </div>`;
  }
}

// Show/hide Telegram BackButton based on step
const _origShowStep = showStep;
window.showStep = function(step) {
  _origShowStep(step);
  if (tg?.BackButton) {
    if (step === 'calendar') tg.BackButton.hide();
    else tg.BackButton.show();
  }
};

// Start
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
